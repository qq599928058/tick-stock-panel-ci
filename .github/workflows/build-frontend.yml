name: build-frontend-dist

# 只做一件事：在 GitHub 的 runner 上把 tick-stock-panel 前端构建出来，
# 产物 (frontend/dist) 作为 artifact 上传 —— 本机内存不够跑 vite build（OOM 被内核杀）。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        working-directory: frontend
        run: pnpm build

      - name: 上传 dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30
